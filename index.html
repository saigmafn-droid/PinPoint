<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05060a">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PinPoint">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<PinPoint>GeoLingo – Learn Geography</PinPoint>
<style>
:root{--bg:#05060a;--card:#0f1220;--line:#1f2540;--blue:#1c9bff;--blue-d:#0a5fb4;--text:#e9eefc;--mute:#7f8bb0;--red:#ff4b5c;--red-d:#b32334;--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito","Segoe UI",system-ui,sans-serif;font-weight:700;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-around;padding:12px 8px;background:rgba(5,6,10,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line);font-size:18px}
.top span b{margin-left:6px}
.unit{margin:18px 14px 0;padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--blue-d));box-shadow:0 5px 0 #063a73}
.unit h2{margin:0;font-size:22px}.unit p{margin:4px 0 0;opacity:.9;font-weight:600}
.path{display:flex;flex-direction:column;align-items:center;padding:26px 0 10px;gap:22px}
.node{width:76px;height:76px;border-radius:50%;font-size:30px;display:grid;place-items:center;position:relative;background:var(--blue);box-shadow:0 7px 0 var(--blue-d);transition:transform .1s}
.node:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--blue-d)}
.node.done{background:var(--gold);box-shadow:0 7px 0 #b58a10}
.node.lock{background:#1a1f35;box-shadow:0 7px 0 #0d1020;color:#4b557a;cursor:not-allowed}
.node.cur::after{content:"START";position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--line);color:var(--blue);padding:4px 12px;border-radius:12px;font-size:13px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.foot{text-align:center;padding:30px;color:var(--mute);font-size:13px}
.foot button{background:none;color:var(--mute);text-decoration:underline;font-size:13px}
/* lesson */
.lesson{display:flex;flex-direction:column;min-height:100vh;padding:16px 18px 0}
.lh{display:flex;align-items:center;gap:14px}
.x{background:none;font-size:26px;color:var(--mute)}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:10px;transition:width .35s}
.hearts{color:var(--red);font-size:18px}
.q{flex:1;padding:26px 0}
.q h1{font-size:24px;margin:0 0 18px}
.big{display:block;margin:0 auto 22px;width:190px;max-width:70%;border-radius:8px;border:2px solid var(--line);background:var(--card)}
.opts{display:grid;gap:12px}
.opts.img{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:14px;padding:15px;font-size:18px;text-align:left;display:flex;align-items:center;justify-content:center}
.opt:not(.txt){justify-content:flex-start}
.opt img{width:100%;border-radius:6px;display:block}
.opt.sel{border-color:var(--blue);background:#0b2140;box-shadow:0 4px 0 var(--blue-d)}
.opt.ok{border-color:var(--blue);background:#0b2a55}
.opt.bad{border-color:var(--red);background:#2b0e14;box-shadow:0 4px 0 var(--red-d)}
.opt:disabled{cursor:default}
input.t{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;font:inherit;font-size:20px;color:var(--text);outline:none}
input.t:focus{border-color:var(--blue)}
.fb{margin:0 -18px;padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-top:2px solid var(--line);background:var(--bg)}
.fb.ok{background:#0a2447;border-color:#0a2447}
.fb.bad{background:#2a0c12;border-color:#2a0c12}
.fb h3{margin:0 0 4px;font-size:20px}.fb.ok h3{color:var(--blue)}.fb.bad h3{color:var(--red)}
.fb p{margin:0 0 12px;color:#ffb3bb}
.go{width:100%;padding:15px;border-radius:14px;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);font-size:17px;letter-spacing:.5px;text-transform:uppercase}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}
.go:disabled{background:var(--line);color:#4b557a;box-shadow:none;cursor:not-allowed}
.fb.bad .go{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.end .e{font-size:84px}.end h1{margin:0;font-size:30px}
.stats{display:flex;gap:14px;margin:14px 0 6px}
.stat{border:2px solid var(--blue);border-radius:14px;min-width:120px;overflow:hidden}
.stat div:first-child{background:var(--blue);font-size:12px;padding:5px;text-transform:uppercase}
.stat div:last-child{padding:12px;font-size:22px}
.end .wrap{width:100%;padding-bottom:18px}
.page{padding-bottom:96px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:rgba(5,6,10,.96);border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;background:none;color:var(--mute);padding:6px 0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
nav button span{font-size:22px}nav button.on{color:var(--blue);background:#0b2140}
.menu{padding:18px 14px;display:grid;gap:12px}.menu h2{margin:6px 4px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;box-shadow:0 4px 0 var(--line);font-size:17px}
.card .ic{font-size:30px}.card small{display:block;color:var(--mute);font-weight:600;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .stat{min-width:0;text-align:center}
.sw{margin-left:auto;padding:6px 14px;border-radius:20px;background:var(--line);font-size:14px}.sw.on{background:var(--blue)}
.map{width:100%;height:auto;max-height:46vh;background:#070b18;border:2px solid var(--line);border-radius:14px;display:block}
.map path{fill:#17213f;stroke:#3a4d86;stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer;fill-rule:evenodd}
.map path.sel{fill:#5cc0ff}.map path.ok{fill:#1c9bff}.map path.bad{fill:var(--red)}
.hint{color:var(--mute);margin:-8px 0 10px;font-weight:600}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:20px}.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px;max-width:340px;width:100%;text-align:center}.box h2{margin:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const RAW=`US|United States|Washington, D.C.|North America|CA,MX
CA|Canada|Ottawa|North America|US
MX|Mexico|Mexico City|North America|US
BR|Brazil|Brasília|South America|AR,PE,CO
AR|Argentina|Buenos Aires|South America|CL,BR
CL|Chile|Santiago|South America|AR,PE
PE|Peru|Lima|South America|BR,CO,CL
CO|Colombia|Bogotá|South America|BR,PE
FR|France|Paris|Europe|BE,DE,ES,IT,CH
DE|Germany|Berlin|Europe|FR,NL,BE,PL,AT,CH
ES|Spain|Madrid|Europe|FR,PT,MA
PT|Portugal|Lisbon|Europe|ES
IT|Italy|Rome|Europe|FR,CH,AT
GB|United Kingdom|London|Europe|IE
IE|Ireland|Dublin|Europe|GB
NL|Netherlands|Amsterdam|Europe|DE,BE
BE|Belgium|Brussels|Europe|FR,NL,DE
CH|Switzerland|Bern|Europe|FR,DE,AT,IT
AT|Austria|Vienna|Europe|DE,CH,IT
PL|Poland|Warsaw|Europe|DE,UA
SE|Sweden|Stockholm|Europe|NO,FI
NO|Norway|Oslo|Europe|SE,FI
FI|Finland|Helsinki|Europe|SE,NO
GR|Greece|Athens|Europe|TR
UA|Ukraine|Kyiv|Europe|PL
TR|Turkey|Ankara|Asia|GR,IR
EG|Egypt|Cairo|Africa|
ZA|South Africa|Pretoria|Africa|
NG|Nigeria|Abuja|Africa|
KE|Kenya|Nairobi|Africa|ET,TZ
ET|Ethiopia|Addis Ababa|Africa|KE
MA|Morocco|Rabat|Africa|DZ,ES
DZ|Algeria|Algiers|Africa|MA
GH|Ghana|Accra|Africa|
TZ|Tanzania|Dodoma|Africa|KE
CN|China|Beijing|Asia|IN,PK,VN
IN|India|New Delhi|Asia|PK,CN
JP|Japan|Tokyo|Asia|
KR|South Korea|Seoul|Asia|
TH|Thailand|Bangkok|Asia|
VN|Vietnam|Hanoi|Asia|CN
ID|Indonesia|Jakarta|Asia|
SA|Saudi Arabia|Riyadh|Asia|
IR|Iran|Tehran|Asia|TR,PK
PK|Pakistan|Islamabad|Asia|IN,CN,IR
AU|Australia|Canberra|Oceania|
NZ|New Zealand|Wellington|Oceania|`.split("\n").map(l=>{const[code,name,cap,cont,b]=l.split("|");return{code,name,cap,cont,bor:b?b.split(","):[]}});
const BY=Object.fromEntries(RAW.map(c=>[c.code,c]));
const CONTS=["Africa","Asia","Europe","North America","South America","Oceania"];
const ALL=["flag","flagpick","cap","rcap","typecap","cont","border","map"];
const UNITS=[
 {n:"Flags",d:"Match flags to countries",t:["flag","flagpick"],i:"🚩"},
 {n:"Capital cities",d:"Know your capitals",t:["cap","rcap","typecap"],i:"🏛️"},
 {n:"Continents",d:"Place countries on Earth",t:["cont","flag"],i:"🌍"},
 {n:"Borders",d:"Who shares a border?",t:["border","cont"],i:"🧭"},
 {n:"Map hunt",d:"Tap the country on the map",t:["map"],i:"🗺️"},
 {n:"Mastery",d:"Everything mixed together",t:ALL,i:"👑"}];
const BASE=UNITS.length,PER=4,LEN=10;
// units after the built-in ones are generated forever
const unit=u=>u<BASE?UNITS[u]:{n:"Challenge "+(u-BASE+1),d:"Endless mixed challenge",t:ALL,i:"⚡"};
const VB={"Africa":"-20 -38 72 76","Asia":"25 -58 125 70","Europe":"-12 -72 60 40","North America":"-135 -72 85 62","South America":"-84 -14 52 70","Oceania":"108 -48 74 42"};

// ---------- STATE ----------
let S;try{S=JSON.parse(localStorage.getItem("geolingo"))}catch(e){}
S=Object.assign({xp:0,streak:0,last:"",done:{},sound:1,best:{},ok:0,bad:0},S||{});
const save=()=>{try{localStorage.setItem("geolingo",JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app");
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const flag=(c,w=160)=>`https://flagcdn.com/w${w}/${c.toLowerCase()}.png`;
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,"");
const MN=c=>c.code==="US"?"United States of America":c.name;
let L=null,TAB="learn";

// ---------- SOUND (synthesized, no files) ----------
let AC;
function tone(f,d,t=0,ty="sine",v=.15){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const sfx={ok:()=>{tone(660,.15);tone(880,.28,.12)},bad:()=>tone(170,.35,0,"sawtooth",.1),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,i*.13)),tap:()=>tone(440,.05,0,"triangle",.08)};

// ---------- MAP DATA (world-atlas TopoJSON, decoded by hand) ----------
let MAP=null;
function topo(t){
 const[sx,sy]=t.transform.scale,[tx,ty]=t.transform.translate;
 const arcs=t.arcs.map(a=>{let x=0,y=0;return a.map(p=>[(x+=p[0])*sx+tx,(y+=p[1])*sy+ty])});
 const ring=ix=>{let r=[];ix.forEach(i=>{const a=i<0?arcs[~i].slice().reverse():arcs[i];r=r.concat(r.length?a.slice(1):a)});return r};
 return t.objects.countries.geometries.map(g=>{const ps=g.type==="Polygon"?[g.arcs]:g.arcs;
  return{name:g.properties.name,d:ps.map(p=>p.map(r=>"M"+ring(r).map(q=>q[0].toFixed(1)+","+(-q[1]).toFixed(1)).join("L")+"Z").join("")).join("")}});
}
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(r=>r.json()).then(t=>{MAP=topo(t);if(!L)render()}).catch(()=>{});
const mapSVG=c=>`<svg class="map" viewBox="${VB[c]}">${MAP.map(m=>`<path data-n="${m.name}" d="${m.d}" onclick="mp(this)"/>`).join("")}</svg>`;

// ---------- QUESTIONS ----------
function mk(type,c){
 const oth=f=>sh(RAW.filter(x=>x!==c&&f(x))).slice(0,3);
 const txt=(ans,ds)=>sh([ans,...ds]).map(v=>({v,h:v}));
 if(type==="border"&&!c.bor.length)type="cap";
 if(type==="map"&&!MAP)type="flag";
 switch(type){
  case"flag":return{p:"Which country's flag is this?",img:c.code,opts:txt(c.name,oth(()=>1).map(x=>x.name)),ans:c.name,txt:1};
  case"flagpick":return{p:`Which is the flag of ${c.name}?`,opts:sh([c,...oth(()=>1)]).map(x=>({v:x.code,h:`<img src="${flag(x.code)}" alt="">`})),ans:c.code,grid:1};
  case"cap":return{p:`What is the capital of ${c.name}?`,opts:txt(c.cap,oth(()=>1).map(x=>x.cap)),ans:c.cap,txt:1};
  case"rcap":return{p:`${c.cap} is the capital of…`,opts:txt(c.name,oth(()=>1).map(x=>x.name)),ans:c.name,txt:1};
  case"typecap":return{p:`Type the capital of ${c.name}`,typed:1,ans:c.cap,img:c.code};
  case"cont":return{p:`Which continent is ${c.name} in?`,img:c.code,opts:txt(c.cont,sh(CONTS.filter(x=>x!==c.cont)).slice(0,3)),ans:c.cont,txt:1};
  case"border":{const a=BY[c.bor[Math.random()*c.bor.length|0]];
   return{p:`Which country shares a border with ${c.name}?`,opts:txt(a.name,oth(x=>!c.bor.includes(x.code)).map(x=>x.name)),ans:a.name,txt:1}}
  case"map":return{p:`Find ${c.name} on the map`,map:c.cont,ans:MN(c),show:c.name};
 }
}
function build(u,l){
 const pool=u<BASE?RAW.slice(0,Math.min(RAW.length,16+l*10)):RAW;
 let ty=unit(u).t.filter(t=>(t!=="typecap"||l>0||u>=BASE)&&(t!=="map"||MAP));
 if(!ty.length)ty=["flag"];
 return sh(pool).slice(0,LEN).map(c=>mk(ty[Math.random()*ty.length|0],c));
}
const gen=()=>mk(L.ty[Math.random()*L.ty.length|0],RAW[Math.random()*RAW.length|0]);

// ---------- SCREENS ----------
const TABS=[["learn","🏠","Learn"],["practice","♾️","Practice"],["profile","👤","Profile"],["settings","⚙️","Settings"]];
const go=t=>{TAB=t;sfx.tap();render()};
const home=()=>{L=null;render()};
function render(){
 let h=`<div class="top"><span>🔥<b>${S.streak}</b></span><span>⚡<b>${S.xp} XP</b></span><span>🌐<b>${Object.keys(S.done).length}</b></span></div>`;
 h+=TAB==="learn"?learn():TAB==="practice"?practice():TAB==="profile"?profile():settings();
 $.innerHTML=`<div class="page">${h}</div><nav>${TABS.map(t=>`<button class="${TAB===t[0]?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("")}</nav>`;
 if(TAB==="learn"){const c=document.querySelector(".cur");if(c)c.scrollIntoView({block:"center"})}
}
function learn(){
 let cur=0;while(S.done[cur])cur++;
 const last=(cur/PER|0)+1; // show finished units, the current one and the next
 let h="";
 for(let u=0;u<=last;u++){
  const U=unit(u);
  h+=`<div class="unit"><h2>Unit ${u+1}: ${U.n}</h2><p>${U.d}</p></div><div class="path">`;
  for(let l=0;l<PER;l++){
   const id=u*PER+l,done=S.done[id],open=id===0||S.done[id-1];
   const off=Math.round(Math.sin(id*1.15)*58);
   h+=`<button class="node ${done?"done":open?"cur":"lock"}" style="transform:translateX(${off}px)" ${open||done?"":"disabled"} onclick="start(${id})" aria-label="Lesson ${id+1}">${done?"★":open?U.i:"🔒"}</button>`;
  }
  h+=`</div>`;
 }
 return h+`<div class="foot">Finish a unit and the next one appears — the path never ends.</div>`;
}
function practice(){
 return `<div class="menu"><h2>Endless practice</h2><p style="color:var(--mute);margin:0 4px;font-weight:600">Keep answering until you lose 3 hearts. Beat your best score!</p>`+
 UNITS.map((u,i)=>`<button class="card" onclick="endless(${i})"><span class="ic">${u.i}</span><div>${u.n}<small>Best: ${S.best[u.n]||0}</small></div></button>`).join("")+`</div>`;
}
function profile(){
 const t=S.ok+S.bad,st=(a,b)=>`<div class="stat"><div>${a}</div><div>${b}</div></div>`;
 return `<div class="menu"><div style="text-align:center;font-size:64px">🧑‍🚀</div><h2 style="text-align:center">Explorer</h2><div class="grid2">`+
  st("Total XP","⚡ "+S.xp)+st("Day streak","🔥 "+S.streak)+st("Lessons done","★ "+Object.keys(S.done).length)+st("Accuracy","🎯 "+(t?Math.round(S.ok/t*100)+"%":"–"))+
  `</div><h2>Best endless scores</h2>`+UNITS.map(u=>`<div class="card"><span class="ic">${u.i}</span><div>${u.n}</div><span class="sw on">${S.best[u.n]||0}</span></div>`).join("")+`</div>`;
}
function settings(){
 return `<div class="menu"><h2>Settings</h2>
 <button class="card" onclick="tog()"><span class="ic">🔊</span><div>Sound effects<small>Correct, wrong and finish sounds</small></div><span class="sw ${S.sound?"on":""}">${S.sound?"On":"Off"}</span></button>
 <div class="card"><span class="ic">🗺️</span><div>Map data<small>${MAP?"Loaded":"Loading… map questions need internet"}</small></div></div>
 <button class="card" onclick="resetAll()"><span class="ic">🗑️</span><div>Reset progress<small>Erase XP, streak, lessons and scores</small></div></button></div>`;
}
function tog(){S.sound=S.sound?0:1;save();sfx.tap();render()}
function resetAll(){
 sfx.tap();
 $.insertAdjacentHTML("beforeend",`<div class="modal" id="mod"><div class="box"><div style="font-size:52px">🗑️</div><h2>Erase all progress?</h2><p style="color:var(--mute);margin:0 0 18px">Your XP, streak, lessons and scores will be deleted.</p><button class="go" style="background:var(--red);box-shadow:0 5px 0 var(--red-d)" onclick="doReset()">Yes, erase</button><br><br><button class="go" style="background:var(--line);box-shadow:none" onclick="document.getElementById('mod').remove()">Cancel</button></div></div>`);
}
function doReset(){S.xp=0;S.streak=0;S.last="";S.done={};S.best={};S.ok=0;S.bad=0;save();TAB="learn";render()}

// ---------- LESSON ----------
function start(id){
 const u=id/PER|0,l=id%PER;
 L={id,queue:build(u,l),total:LEN,solved:0,hearts:5,miss:0};sfx.tap();q();
}
function endless(i){
 const ty=UNITS[i].t.filter(t=>t!=="map"||MAP);
 L={endless:UNITS[i].n,ty:ty.length?ty:["flag"],queue:[],solved:0,hearts:3,miss:0};
 for(let k=0;k<3;k++)L.queue.push(gen());sfx.tap();q();
}
const hd=()=>(L.endless?`⭐ ${L.solved} `:"")+`❤️ ${Math.max(L.hearts,0)}`;
const pct=()=>L.endless?(L.solved%10)*10:L.solved/L.total*100;
function q(){
 const Q=L.queue[0];L.sel=null;L.checked=false;
 let b="";
 if(Q.img)b+=`<img class="big" src="${flag(Q.img,320)}" alt="Flag">`;
 if(Q.map)b+=mapSVG(Q.map);
 if(Q.typed)b+=`<input class="t" id="inp" autocomplete="off" autocapitalize="words" placeholder="Type your answer" oninput="document.getElementById('chk').disabled=!this.value.trim()">`;
 else if(!Q.map)b+=`<div class="opts ${Q.grid?"img":""}">${Q.opts.map((o,i)=>`<button class="opt ${Q.txt?"txt":""}" onclick="pick(${i})">${o.h}</button>`).join("")}</div>`;
 $.innerHTML=`<div class="lesson"><div class="lh"><button class="x" onclick="home()" aria-label="Quit">✕</button><div class="bar"><i style="width:${pct()}%"></i></div><div class="hearts">${hd()}</div></div>
 <div class="q"><h1>${Q.p}</h1>${Q.map?`<p class="hint">Zoomed to ${Q.map}. Tap a country, then check.</p>`:""}${b}</div>
 <div class="fb" id="fb"><button class="go" id="chk" disabled onclick="check()">Check</button></div></div>`;
 if(Q.typed)document.getElementById("inp").focus();
}
function pick(i){
 if(L.checked)return;L.sel=i;sfx.tap();
 document.querySelectorAll(".opt").forEach((b,j)=>b.classList.toggle("sel",j===i));
 document.getElementById("chk").disabled=false;
}
function mp(el){
 if(L.checked)return;L.sel=el.dataset.n;sfx.tap();
 document.querySelectorAll(".map path").forEach(p=>p.classList.remove("sel"));
 el.classList.add("sel");document.getElementById("chk").disabled=false;
}
function check(){
 if(L.checked)return;
 const Q=L.queue[0];let ok,shown=Q.ans;
 if(Q.typed){
  const v=norm(document.getElementById("inp").value);
  ok=v===norm(Q.ans)||v===norm(Q.ans.split(",")[0]);
  document.getElementById("inp").disabled=true;
 }else if(Q.map){
  ok=L.sel===Q.ans;shown=Q.show;
  document.querySelectorAll(".map path").forEach(p=>{p.classList.remove("sel");if(p.dataset.n===Q.ans)p.classList.add("ok");else if(p.dataset.n===L.sel)p.classList.add("bad")});
 }else{
  ok=Q.opts[L.sel].v===Q.ans;
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;b.classList.remove("sel");if(Q.opts[j].v===Q.ans)b.classList.add("ok");else if(j===L.sel)b.classList.add("bad")});
  if(Q.grid)shown=BY[Q.ans].name;
 }
 L.checked=true;S[ok?"ok":"bad"]++;save();
 if(L.endless){L.queue.shift();L.queue.push(gen());ok?L.solved++:(L.hearts--,L.miss++)}
 else if(ok){L.solved++;L.queue.shift()}
 else{L.hearts--;L.miss++;L.queue.push(L.queue.shift())}
 const last=!L.endless&&ok&&!L.queue.length,dead=L.hearts<=0;
 ok?sfx.ok():sfx.bad();
 const fb=document.getElementById("fb");fb.className="fb "+(ok?"ok":"bad");
 fb.innerHTML=`<h3>${ok?["Correct!","Nice one!","Spot on!","You got it!"][Math.random()*4|0]:"Not quite"}</h3>${ok?"":`<p>Correct answer: ${shown}</p>`}<button class="go" onclick="next(${dead},${last})">${dead||last?"Finish":"Continue"}</button>`;
 document.querySelector(".bar i").style.width=pct()+"%";
 document.querySelector(".hearts").textContent=hd();
 document.querySelector(".go").focus();
}
function next(dead,last){
 if(dead)return L.endless?endEnd():fail();
 if(last)return win();
 q();
}
const endScreen=(e,title,sub,stats,btns)=>{$.innerHTML=`<div class="lesson"><div class="end"><div class="e">${e}</div><h1>${title}</h1>${sub}<div class="stats">${stats}</div><div class="wrap">${btns}</div></div></div>`};
const stat=(a,b)=>`<div class="stat"><div>${a}</div><div>${b}</div></div>`;
function win(){
 const gain=10+Math.max(0,5-L.miss)*2;
 S.xp+=gain;S.done[L.id]=1;
 const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
 if(S.last!==t){S.streak=S.last===y?S.streak+1:1;S.last=t}
 save();sfx.win();
 endScreen("🏆","Lesson complete!","",stat("Total XP","⚡ "+gain)+stat("Accuracy","🎯 "+Math.round(LEN/(LEN+L.miss)*100)+"%"),`<button class="go" onclick="home()">Continue</button>`);
}
function fail(){
 sfx.bad();
 endScreen("💔","Out of hearts",`<p style="color:var(--mute)">Review and try again — you've got this.</p>`,"",
 `<button class="go" onclick="start(${L.id})">Try again</button><br><br><button class="go" style="background:var(--card);box-shadow:0 5px 0 var(--line)" onclick="home()">Back to path</button>`);
}
function endEnd(){
 const m=L.endless,nb=L.solved>(S.best[m]||0);
 if(nb)S.best[m]=L.solved;S.xp+=L.solved*2;save();sfx.win();
 endScreen(nb?"🏅":"🏁",nb?"New best!":"Run over",`<p style="color:var(--mute)">${m} · endless practice</p>`,stat("Score","⭐ "+L.solved)+stat("Best","🏆 "+S.best[m]),
 `<button class="go" onclick="endless(${UNITS.findIndex(u=>u.n===m)})">Play again</button><br><br><button class="go" style="background:var(--card);box-shadow:0 5px 0 var(--line)" onclick="home()">Done</button>`);
}
document.addEventListener("keydown",e=>{
 if(e.key!=="Enter"||!L)return;
 const b=document.querySelector(".fb .go");if(b&&!b.disabled){e.preventDefault();b.click()}
});
render();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
